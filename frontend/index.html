<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The AgriLink leaf, the same one the mobile app uses. The PNG is for browsers without SVG icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@500;600;700;800&family=Anek+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&family=Yaldevi:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AgriLink Sri Lanka</title>
    <script>
      // Resolve and paint the theme (and motion level) before first paint. Without this, the app
      // renders one frame on the light canvas and then swaps, which reads as a
      // flash for dark-mode users. Kept inline and dependency-free so it runs
      // ahead of the module bundle; mirrors src/lib/themeStorage.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('agrilink.theme')
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : preference === 'dark'
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'

          // Motion level, mirrors src/lib/motionLevel.ts: the user's choice, or with "system",
          // off for reduced motion and lite when the browser asks to save data.
          var motion = localStorage.getItem('agrilink.motion')
          if (motion !== 'full' && motion !== 'lite' && motion !== 'off') {
            var saveData = navigator.connection && navigator.connection.saveData
            motion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
              ? 'off'
              : saveData
                ? 'lite'
                : 'full'
          }
          root.dataset.motion = motion
        } catch (error) {
          // Private mode, disabled storage, or no matchMedia — fall through to
          // the light default already in the stylesheet.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
